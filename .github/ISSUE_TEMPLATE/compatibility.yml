name: Plugin compatibility report
description: Report a V2 compatibility result with evidence
title: "compatibility: "
labels: [compatibility]
body:
  - type: input
    id: plugin
    attributes:
      label: Plugin/package
      placeholder: opencode-example@1.2.3
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include OpenCode version, OS, commands, and output.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I did not include credentials or private data.
          required: true
